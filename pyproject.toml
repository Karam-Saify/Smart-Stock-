[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-stock-research"
version = "0.1.0"
description = "Statistical research framework for equity and ETF time series"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.11", "statsmodels>=0.14", "arch>=6.2", "scikit-learn>=1.3", "hmmlearn>=0.3", "ruptures>=1.1", "yfinance>=0.2.40"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
